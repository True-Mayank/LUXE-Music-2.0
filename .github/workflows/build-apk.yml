- name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          packages: "" # Skip default packages that cause conflicts

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          echo "Using sdkmanager: $SDKMANAGER"

          # Only install platform-tools; Gradle will handle downloading 
          # the specific platforms/build-tools specified in your project build.gradle
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
